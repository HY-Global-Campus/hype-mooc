services:
  dev:
    image: mcr.microsoft.com/devcontainers/javascript-node:20-bookworm
    init: true
    volumes:
      # Relative paths are resolved from ../docker-compose.yml, the first compose file.
      - .:/workspace:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  app:
    environment:
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}

  frontend:
    command:
      - sh
      - -c
      - npm run dev -- --host 0.0.0.0 --port ${PORT:-5173} --strictPort
